<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopZone - Shopping Cart</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        
        header {
            background-color: #ff6f61;
            color: white;
            padding: 1rem 0;
            text-align: center;
        }
        
        main {
            padding: 2rem;
        }
        
        .cart-container {
            display: flex;
            gap: 2rem;
        }
        
        .cart-items {
            flex: 3;
        }
        
        .cart-item {
            background: white;
            padding: 1rem;
            margin-bottom: 1rem;
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        
        .cart-item img {
            width: 100px;
            height: 100px;
            object-fit: cover;
        }
        
        .item-details {
            flex: 1;
        }
        
        .cart-summary {
            flex: 1;
            background: white;
            padding: 1rem;
        }
        
        .checkout-btn {
            background-color: #ff6f61;
            color: white;
            border: none;
            padding: 0.75rem;
            width: 100%;
            cursor: pointer;
        }
        
        footer {
            text-align: center;
            padding: 1rem 0;
            background-color: #333;
            color: white;
            margin-top: 2rem;
        }
    </style>
</head>

<body>
    <header>
        <h1>ShopZone</h1>
        <p>Your go-to place for unbeatable online shopping deals!</p>
    </header>
    <main>
        <h2>Your Shopping Cart</h2>
        <div class="cart-container">
            <div class="cart-items">
                <div class="cart-item">
                    <img src="wirehead.jpg" alt="Wireless Headphones">
                    <div class="item-details">
                        <h3>Wireless Headphones</h3>
                        <p>Rs.4999.99</p>
                        <input type="number" value="1" min="1" class="quantity">
                        <button class="remove-btn">Remove</button>
                    </div>
                </div>
                <div class="cart-item">
                    <img src="https://m.media-amazon.com/images/I/71-d7XDbhIL._SX679_.jpg" alt="Samsung Galaxy S25 Ultra 5G AI Smartphone">
                    <div class="item-details">
                        <h3>Samsung Galaxy S25 Ultra 5G AI Smartphone</h3>
                        <p>Rs.1,29,999</p>
                        <input type="number" value="2" min="1" class="quantity">
                        <button class="remove-btn">Remove</button>
                    </div>
                </div>
            </div>
            <div class="cart-summary">
                <p>Subtotal: 1,34,998.99</p>
                <p>Tax: Rs.1000</p>
                <p><strong>Total: Rs.1,35,998.99</strong></p>
                <button class="checkout-btn">Proceed to Checkout</button>
            </div>
        </div>
    </main>
    <footer>
        <p>&copy; 2026 ShopZone. All rights reserved.</p>
    </footer>
</body>

</html>
